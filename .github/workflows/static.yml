name: Update Website

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true   # keep GITHUB_TOKEN configured for git push

    - uses: r-lib/actions/setup-pandoc@v2
    - uses: r-lib/actions/setup-r@v2

    - name: Install R and R Markdown
      run: |
        sudo apt-get install r-base
        sudo R -e "install.packages(c('rmarkdown', 'reticulate'), repos='http://cran.rstudio.com/')"

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install texlive-latex-recommended
        sudo apt-get install texlive-fonts-recommended
        sudo apt-get install texlive-latex-extra
        sudo apt install dvipng
        sudo apt install texlive-pictures
        sudo apt install texlive-extra-utils
        sudo apt install texlive-font-utils  # Needed for eps figures to work
        sudo apt install latexmk  # Needed for running LaTeX in Sublime Text
        sudo apt install texlive-lang-greek  # Needed for the textgreek package
        sudo apt install cm-super  # Needed for using LaTeX in Matplotlib plot labels
        # Move textgreek.sty file
        sudo mv textgreek.sty /usr/share/texmf/tex/latex/textgreek.sty
        sudo mktexlsr

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        # Install Python dependencies
        pip install -r requirements.txt

    - name: Run Python Scripts
      run: |
        cd rowing/isis_flag_history
        python get_flag_status.py
        python analyse_flag_status.py -l -p "master.csv"
        cd ..
        cd ..

    - name: Commit Python-generated files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add rowing/isis_flag_history/*.png
        git add rowing/isis_flag_history/*.txt
        git add rowing/isis_flag_history/master.csv

        # Avoid committing Rmd cache folders
        git restore --staged rowing/isis_flag_history/*_files || true

        if git diff --cached --quiet; then
          echo "No Python-generated changes to commit"
        else
          git commit -m "Update flag status plots and master.csv"
          git push
        fi

    - name: Render R Markdown page
      run: Rscript -e "rmarkdown::render('rowing/isis_flag_history.Rmd')"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'  # Deploy the entire repository root

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
