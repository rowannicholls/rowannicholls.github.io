name: Update Website

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: true   # keep GITHUB_TOKEN configured for git push

    - uses: r-lib/actions/setup-pandoc@v2
    - uses: r-lib/actions/setup-r@v2

    - name: Install R and R Markdown
      run: |
        sudo apt-get install r-base
        sudo R -e "install.packages(c('rmarkdown', 'reticulate'), repos='http://cran.rstudio.com/')"

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install texlive-latex-recommended
        sudo apt-get install texlive-fonts-recommended
        sudo apt-get install texlive-latex-extra
        sudo apt install dvipng
        sudo apt install texlive-pictures
        sudo apt install texlive-extra-utils
        sudo apt install texlive-font-utils  # Needed for eps figures to work
        sudo apt install latexmk  # Needed for running LaTeX in Sublime Text
        sudo apt install texlive-lang-greek  # Needed for the textgreek package
        sudo apt install cm-super  # Needed for using LaTeX in Matplotlib plot labels
        # Move textgreek.sty file
        sudo mv textgreek.sty /usr/share/texmf/tex/latex/textgreek.sty
        sudo mktexlsr

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        # Install Python dependencies
        pip install -r requirements.txt

    - name: Run Python Scripts
      run: |
        python rowing/isis_flag_history/get_flag_status.py
        python rowing/isis_flag_history/analyse_flag_status.py -l -p "rowing/isis_flag_history/master.csv"
        
    - name: Run R Markdown Script
      run: |
        Rscript -e "rmarkdown::render('rowing/isis_flag_history.Rmd')"

    - name: Show generated files (before commit)
      run: |
        echo "Working dir:"
        pwd
        echo "List repo files:"
        ls -R .
        echo "Check CSS and fonts"
        if [ -f style.css ]; then echo "style.css exists"; else echo "style.css MISSING"; fi
        if [ -d fonts ]; then echo "fonts/ exists:"; ls -l fonts || true; else echo "fonts/ MISSING"; fi
        echo "List plots folder"
        ls -l rowing/isis_flag_history || true

    - name: Commit updated data and plots
      if: github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        # Configure git
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

        # Ensure branch
        git checkout "${GITHUB_REF#refs/heads/}" || git checkout -b master

        # Stage likely changed files
        git add rowing/isis_flag_history/*.png || true
        git add rowing/isis_flag_history/master.csv || true
        git add style.css || true
        git add fonts/* || true

        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update plots and master.csv via workflow"
          # Use token in remote URL to guarantee push works
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD
        fi

    - name: Show repo state after commit
      run: |
        echo "Remote HEAD:"
        git rev-parse --short HEAD
        echo "Files in repo root:"
        ls -l
        echo "Check style.css and fonts again"
        if [ -f style.css ]; then echo "style.css exists"; else echo "style.css MISSING"; fi
        if [ -d fonts ]; then ls -l fonts || true; else echo "fonts/ MISSING"; fi
        echo "List plots folder"
        ls -l rowing/isis_flag_history || true

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'  # Uploads entire repository

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
