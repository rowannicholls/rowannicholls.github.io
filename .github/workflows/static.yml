name: Update Isis Flag History

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run get_flag_status.py
        run: |
          python rowing/isis_flag_history/get_flag_status.py

      - name: Run analyse_flag_status.py
        run: |
          python rowing/isis_flag_history/analyse_flag_status.py

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('rmarkdown'), repos='https://cloud.r-project.org')"

      - name: Render isis_flag_history.Rmd
        run: |
          Rscript -e "rmarkdown::render('rowing/isis_flag_history.Rmd', output_file = 'isis_flag_history.html', output_dir = 'rowing')"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Automated update of Isis flag data and site'
          git push
