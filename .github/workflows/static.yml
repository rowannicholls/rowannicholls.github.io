name: Update Isis Flag History

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run get_flag_status.py
        run: |
          python rowing/isis_flag_history/get_flag_status.py || true

      - name: Run analyse_flag_status.py
        run: |
          python rowing/isis_flag_history/analyse_flag_status.py

      # R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages('rmarkdown', repos='https://cloud.r-project.org')"

      - name: Render isis_flag_history.Rmd
        run: |
          Rscript -e "rmarkdown::render('rowing/isis_flag_history.Rmd', output_file='isis_flag_history.html', output_dir='rowing')"

      # Prepare site
      - name: Prepare static site
        run: |
          mkdir site
          cp -r index.html rowing.html style.css fonts google_analytics.html textgreek.sty site/
          cp -r rowing site/

      # Deploy
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
